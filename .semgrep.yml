rules:
  - id: avoid-eval
    languages:
      - javascript
      - typescript
    message: Avoid eval() and Function() constructors because they execute arbitrary code.
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: avoid-innerhtml
    languages:
      - javascript
      - typescript
    message: Prefer DOM APIs over innerHTML when rendering untrusted content.
    severity: WARNING
    pattern: $X.innerHTML = ...

  - id: avoid-hardcoded-secrets
    languages:
      - generic
    message: Avoid hard-coded credentials or tokens in source code.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: "$VAR = \"$VALUE\""
          - pattern: "$VAR = '$VALUE'"
          - pattern: "$VAR: \"$VALUE\""
          - pattern: "$VAR: '$VALUE'"
      - metavariable-regex:
          metavariable: $VAR
          regex: '^(password|apiKey|token|secret)$'
      - metavariable-regex:
          metavariable: $VALUE
          regex: '.{8,}'
      - pattern-not-regex: ".*(REPLACE_ME|YOUR_.*|changeme|example).*"

paths:
  include:
    - 'src/**'
    - 'scripts/**'
    - '.github/workflows/**'
  exclude:
    - '**/*.test.js'
    - '**/*.test.jsx'
    - '**/*.spec.js'
    - '**/*.spec.jsx'
    - 'docs/**'
    - '**/security-scan-results.txt'
    - '**/SECURITY_BEST_PRACTICES.md'
    - '**/SECURITY_ACTION_PLAN.md'
    - '**/AUDIT_SECURITY.md'
