# Semgrep Configuration — Wakkany Security Rules
# Scans for security vulnerabilities, best practices, and Wakkany-specific patterns
# Severity: CRITICAL/ERROR blocks pipeline; HIGH/MEDIUM are warnings

rules:
  # =========================================================================
  # CODE INJECTION & EVAL — CRITICAL
  # =========================================================================
  - id: avoid-eval
    languages:
      - javascript
      - typescript
    message: Avoid eval() and Function() constructors because they execute arbitrary code and are a major security risk.
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: $X.eval(...)
      - pattern: Function(...)

  # =========================================================================
  # XSS — Cross-Site Scripting
  # =========================================================================
  - id: avoid-innerhtml
    languages:
      - javascript
      - typescript
    message: Avoid innerHTML assignments in React or browser code because they can introduce XSS vulnerabilities.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $X.innerHTML = ...
          - pattern: $X.innerHTML += ...
          - pattern: element.innerHTML = ...

  - id: avoid-dangerouslysetinnerhtml
    languages:
      - javascript
      - typescript
    message: Avoid dangerouslySetInnerHTML in React - it opens XSS vulnerabilities. Use sanitization libraries like DOMPurify.
    severity: WARNING
    pattern-regex: 'dangerouslySetInnerHTML\\s*=\\s*\\{\\{\\s*__html\\s*:'

  # =========================================================================
  # HARDCODED SECRETS & CREDENTIALS — CRITICAL
  # =========================================================================
  - id: avoid-hardcoded-secrets
    languages:
      - javascript
      - typescript
      - python
      - json
      - yaml
    message: Avoid hard-coded credentials, tokens, API keys, or passwords in source code. Use environment variables or GitHub Secrets.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: "$VAR = \"$VALUE\""
          - pattern: "$VAR = '$VALUE'"
          - pattern: "$VAR: \"$VALUE\""
          - pattern: "$VAR: '$VALUE'"
          - pattern: "$VAR = `$VALUE`"
      - metavariable-regex:
          metavariable: $VAR
          regex: '^(password|passwd|pwd|apiKey|api_key|token|secret|secretKey|secret_key|auth|Authorization|credential|credentials|privKey|private_key|accessKey|access_key|privateToken|private_token|supabaseKey|supabase_key|vercelToken|vercel_token)$'
      - metavariable-regex:
          metavariable: $VALUE
          regex: '.{8,}'
      - pattern-not-regex: ".*(REPLACE_ME|YOUR_|changeme|example|xxx|test|demo|placeholder|null|undefined|false|true|0|1).*"

  # =========================================================================
  # SQL INJECTION
  # =========================================================================
  - id: potential-sql-injection
    languages:
      - javascript
      - typescript
      - python
    message: Potential SQL injection vulnerability. Use parameterized queries or prepared statements instead of string concatenation.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $DB.query($X + $Y)
          - pattern: $DB.query(`...${$VAR}...`)
          - pattern: $DB.execute($X + $Y)
      - pattern-not: $DB.query($PREPARED_STATEMENT, [$PARAMS])

  # =========================================================================
  # WEAK CRYPTOGRAPHY
  # =========================================================================
  - id: weak-crypto-md5-sha1
    languages:
      - javascript
      - typescript
      - python
    message: MD5 and SHA1 are cryptographically weak. Use SHA256 or stronger algorithms for security.
    severity: HIGH
    patterns:
      - pattern-either:
          - pattern: crypto.createHash('md5')
          - pattern: crypto.createHash('sha1')
          - pattern: require('md5')
          - pattern: require('sha1')

  - id: insecure-random-for-crypto
    languages:
      - javascript
      - typescript
    message: Math.random() is not cryptographically secure. Use crypto.getRandomValues() or crypto.randomBytes() for security-sensitive operations.
    severity: HIGH
    patterns:
      - pattern-either:
          - pattern: Math.random().toString(36).substr(...)
          - pattern: Math.random().toString(16).slice(...)
          - pattern: |
              $X = Math.random()

  # =========================================================================
  # SENSITIVE DATA IN LOGS
  # =========================================================================
  - id: sensitive-data-logging
    languages:
      - javascript
      - typescript
    message: Avoid logging sensitive data (passwords, tokens, keys, PII). Use redaction or skip logging altogether.
    severity: HIGH
    patterns:
      - pattern-either:
          - pattern: console.log($PASSWORD)
          - pattern: console.error($TOKEN)
          - pattern: console.warn($API_KEY)
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: '(password|token|secret|apiKey|api_key|auth|Authorization)'

  # =========================================================================
  # INSECURE DEPENDENCY USAGE
  # =========================================================================
  - id: deprecated-request-library
    languages:
      - javascript
      - typescript
    message: The 'request' library is deprecated. Use 'axios', 'node-fetch', or native fetch() instead.
    severity: MEDIUM
    pattern-either:
      - pattern: require('request')
      - pattern: import ... from 'request'

  # =========================================================================
  # SUPABASE-SPECIFIC SECURITY — WAKKANY
  # =========================================================================
  - id: supabase-missing-rls
    languages:
      - javascript
      - typescript
    message: Ensure Row-Level Security (RLS) is enabled on this Supabase table. Check your Supabase SQL migrations.
    severity: WARNING
    pattern: '$TABLE.select($X)'
    pattern-not: |
      // RLS enabled on $TABLE

  - id: supabase-direct-upsert-not-recommended
    languages:
      - javascript
      - typescript
    message: Avoid direct table upserts without RLS. Use Supabase RPC functions or stored procedures with security context instead.
    severity: WARNING
    pattern: '$SUPABASE.from($TABLE).upsert(...)'
    pattern-not: '$RPC = ... # This is a secured RPC call'

  - id: supabase-no-anon-key-in-build
    languages:
      - javascript
      - typescript
    message: VITE_SUPABASE_ANON_KEY is safe to expose (it's for public client access), but never hardcode database URLs or service role keys.
    severity: HIGH
    patterns:
      - pattern-either:
          - pattern: const $VAR = "$SECRET_KEY"
      - metavariable-regex:
          metavariable: $VAR
          regex: '(supabaseServiceRoleKey|SUPABASE_SERVICE_ROLE_KEY|databaseUrl|DATABASE_URL)'

  # =========================================================================
  # ENV VARIABLE EXPOSURE IN FRONTEND
  # =========================================================================
  - id: backend-secrets-exposed-to-frontend
    languages:
      - javascript
      - typescript

    message: Backend secrets (database URLs, API secrets) should NEVER be exposed to frontend. Only use VITE_* prefixed public env vars.
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: process.env.DATABASE_URL
          - pattern: process.env.SUPABASE_SERVICE_ROLE_KEY
          - pattern: process.env.STRIPE_SECRET_KEY
          - pattern: process.env.API_SECRET
          - pattern: process.env.ADMIN_TOKEN
          - pattern: process.env.PRIVATE_KEY

  - id: vite-env-prefix-required
    languages:
      - javascript
      - typescript

    message: In Vite, use 'import.meta.env.VITE_*' for public variables, not 'process.env'. Frontend can only access VITE_ prefixed vars.
    severity: MEDIUM
    pattern: process.env.$PUBLIC_VAR
    pattern-not: process.env.NODE_ENV

  # =========================================================================
  # WAKKANY-SPECIFIC PATTERNS
  # =========================================================================
  # =========================================================================
  # CORS MISCONFIGURATION
  # =========================================================================
  - id: cors-allow-all-origins
    languages:
      - javascript
      - typescript
    message: CORS should not allow all origins ('*'). Specify allowed origins explicitly to prevent unauthorized cross-origin requests.
    severity: HIGH
    pattern-either:
      - pattern: 'cors({ origin: ''*'' })'
      - pattern: 'app.use(cors())'

  # =========================================================================
  # CLICKJACKING PROTECTION
  # =========================================================================
  - id: missing-x-frame-options
    languages:
      - javascript
      - typescript
    message: Consider adding X-Frame-Options header to prevent clickjacking attacks.
    severity: MEDIUM
    pattern: 'app.use(...)'
    pattern-not-inside: 'app.use((req, res) => { res.set(''X-Frame-Options'', ...) })'

  # =========================================================================
  # PATH TRAVERSAL
  # =========================================================================
  - id: path-traversal-risk
    languages:
      - javascript
      - typescript
    message: Potential path traversal vulnerability. Validate and sanitize user input before using in file paths.
    severity: MEDIUM
    patterns:
      - pattern-either:
          - pattern: 'fs.readFile($USER_INPUT)'
          - pattern: 'fs.readFileSync($USER_INPUT)'
          - pattern: 'fs.writeFile($USER_INPUT, ...)'
          - pattern: 'path.join(...)'
      - pattern-not: 'path.join(__dirname, ''safe-folder'', $FILENAME)'

  # =========================================================================
  # COMMAND INJECTION
  # =========================================================================
  - id: command-injection-risk
    languages:
      - javascript
      - typescript
    message: Potential command injection. Use safe APIs (like child_process.execFile) instead of shell execution.
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: 'child_process.exec($USER_INPUT)'
          - pattern: 'child_process.execSync($USER_INPUT)'
          - pattern: 'require(''child_process'').exec(...)'

# =========================================================================
# GLOBAL CONFIGURATION
# =========================================================================
paths:
  include:
    - 'src/**'
    - 'scripts/**'
    - '.github/workflows/**'
    - 'supabase/functions/**'

  exclude:
    - '**/*.test.js'
    - '**/*.test.jsx'
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '**/*.spec.js'
    - '**/*.spec.jsx'
    - '**/*.spec.ts'
    - '**/*.spec.tsx'
    - 'node_modules/**'
    - 'dist/**'
    - 'build/**'
    - '.next/**'
    - 'coverage/**'
    - 'docs/**'
    - 'docs-generated/**'
    - '**/security-scan-results.txt'
    - '**/SECURITY_BEST_PRACTICES.md'
    - '**/SECURITY_ACTION_PLAN.md'
    - '**/AUDIT_SECURITY.md'
    - '**/AMELIORATIONS_wakkany.md'

# Severity threshold for pipeline failure
# CRITICAL and ERROR will fail the build
severity: MEDIUM
