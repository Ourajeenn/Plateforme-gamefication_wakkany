# fly.toml — Configuration de déploiement Fly.io pour Wakkany
# Généré pour l'application : cuisineensemble
# Région principale : ams (Amsterdam)

app = "cuisineensemble"
primary_region = "ams"

# ─── Build ──────────────────────────────────────────────────────────────────
# Fly.io utilisera le Dockerfile présent à la racine du projet.
[build]
  dockerfile = "Dockerfile"

# ─── Services HTTP ──────────────────────────────────────────────────────────
[[services]]
  protocol = "tcp"
  internal_port = 80
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"
    protocol = "http"

# ─── Variables d'environnement (non-secrètes) ────────────────────────────────
# Les secrets (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY) doivent être définis via :
#   flyctl secrets set VITE_SUPABASE_URL=... VITE_SUPABASE_ANON_KEY=...
[env]
  NODE_ENV = "production"

# ─── Machines (VM) ───────────────────────────────────────────────────────────
[machines]
  cpus = 1
  memory_mb = 256
