name: CI/CD - Build & Deploy (GitHub Pages Only)

on:
  push:
    branches:
      - main
      - dev
      - 'features/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # =====================================================================
  # LINT — Qualité de code
  # =====================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
        continue-on-error: true

  # =====================================================================
  # SECURITY — Scan de secrets et vulnérabilités
  # =====================================================================
  secret_scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Scan des secrets potentiels
        run: npm run security:scan
        continue-on-error: true

  npm_audit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit des dépendances npm
        run: npm run security:audit
        continue-on-error: true

  fs_security_scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Scan du dépôt avec Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          format: 'table'

  # =====================================================================
  # TESTS — Exécution des tests
  # =====================================================================
  test:
    runs-on: ubuntu-latest
    needs: [secret_scan, npm_audit, fs_security_scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm run test
        continue-on-error: true

  # =====================================================================
  # BUILD — Production build for Vercel
  # =====================================================================
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Build avec base path pour déploiement Vercel
      - name: Build pour Vercel
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Upload des artefacts pour vérifications futures (optionnel)
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist

  # =====================================================================
  # DOCKER SCAN — Scan de sécurité de l'image Docker
  # =====================================================================
  docker_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t wakkany:ci .
      - name: Scan avec Trivy (image)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: wakkany:ci
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          format: 'table'

  # =====================================================================
  # SEMGREP — Analyse statique du code
  # =====================================================================
  semgrep_scan:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep security analysis (JSON + conditional fail)
        run: |
          python -m semgrep --config .semgrep.yml --json . > semgrep_results.json || true
          python scripts/semgrep_check.py semgrep_results.json
        continue-on-error: false

  # =====================================================================
  # SUCCESS — Pipeline complet
  # =====================================================================
  pipeline_success:
    runs-on: ubuntu-latest
    needs: [build, docker_scan, semgrep_scan]
    if: success()
    steps:
      - name: Pipeline completed successfully
        run: echo "All checks passed. Vercel webhook will now trigger deployment."
