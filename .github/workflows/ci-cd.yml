name: CI/CD - Build, Security & Deploy

# Le pipeline est consolidé en un seul workflow pour éviter les dépendances
# inter-workflows et les déploiements dupliqués sur Vercel/GitHub Pages.

on:
  push:
    branches:
      - main
      - dev
      - 'features/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Qualité de code
  # ─────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ─────────────────────────────────────────────────────────────────
  # Sécurité — secrets, audit npm, scan filesystem (parallèle à lint)
  # ─────────────────────────────────────────────────────────────────
  secret_scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Scan des secrets potentiels
        run: npm run security:scan

  npm_audit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run security:audit

  fs_security_scan:
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Scan du dépôt avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          skip-dirs: 'node_modules,dist'

  # ─────────────────────────────────────────────────────────────────
  # Analyse statique Semgrep (non-bloquante, parallèle aux autres jobs)
  # continue-on-error: true signifie que les résultats sont informatifs
  # ─────────────────────────────────────────────────────────────────
  semgrep_scan:
    runs-on: ubuntu-latest
    needs: [secret_scan, npm_audit, fs_security_scan]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install semgrep
      - name: Analyse Semgrep
        run: semgrep --config .semgrep.yml --error --quiet . || true

  # ─────────────────────────────────────────────────────────────────
  # Tests — ne dépend PAS de semgrep, mais des jobs de sécurité
  # ─────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [secret_scan, npm_audit, fs_security_scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test

  # ─────────────────────────────────────────────────────────────────
  # Build — dépend uniquement de test (tests passent = build OK)
  # ─────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Build Vercel (base path = /)
      - name: Build pour Vercel
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Artefact réutilisable par deploy_vercel
      - uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist

      # Rebuild pour GitHub Pages avec le bon base path
      - name: Build pour GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Artefact spécifique pour deploy-pages
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # ─────────────────────────────────────────────────────────────────
  # Scan Docker (non-bloquant, continue-on-error: true)
  # ─────────────────────────────────────────────────────────────────
  docker_scan:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image Docker
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile — skipping docker scan"
            exit 0
          fi
          docker build -t wakkany:ci .
      - name: Scan de l'image avec Trivy
        if: success()
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: wakkany:ci
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  # ─────────────────────────────────────────────────────────────────
  # Déploiement GitHub Pages (main uniquement)
  # ─────────────────────────────────────────────────────────────────
  deploy_github_pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, docker_scan]
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify_github_pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy_github_pages
    steps:
      - name: Attente de propagation
        run: sleep 30
      - name: Vérification du site déployé
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Test de $URL"
          curl -f -L "$URL" || exit 1

  # ─────────────────────────────────────────────────────────────────
  # Déploiement Vercel (prod sur main, preview sur dev/features)
  # ─────────────────────────────────────────────────────────────────
  deploy_vercel:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build, docker_scan]
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets Vercel
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets Vercel manquants (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID). Déploiement ignoré."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupération du build artifact
        if: steps.vercel_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: ./dist

      - name: Installer Vercel CLI
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: npm install -g vercel@41.7.8

      - name: Déploiement Vercel (Production — main)
        if: steps.vercel_secrets.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy ./dist --prebuilt=true --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee vercel_output.txt
          DEPLOY_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' vercel_output.txt | tail -1 || true)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Déployé: $DEPLOY_URL"

      - name: Déploiement Vercel (Preview — dev / features)
        if: steps.vercel_secrets.outputs.configured == 'true' && github.ref != 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel deploy ./dist --prebuilt=true --yes --token="$VERCEL_TOKEN" 2>&1 | tee vercel_output.txt
          DEPLOY_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' vercel_output.txt | tail -1 || true)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Déployé: $DEPLOY_URL"

      - name: Vérification du déploiement
        if: steps.vercel_secrets.outputs.configured == 'true' && env.deploy_url != ''
        run: |
          echo "Deploy URL: ${{ env.deploy_url }}"
          sleep 10
          curl -f -L "${{ env.deploy_url }}" || echo "Warning: site check failed (may still be propagating)"

      - name: Skip (secrets absents)
        if: steps.vercel_secrets.outputs.configured != 'true'
        run: echo "Déploiement Vercel ignoré — configurez VERCEL_TOKEN, VERCEL_ORG_ID et VERCEL_PROJECT_ID dans les secrets du dépôt."
