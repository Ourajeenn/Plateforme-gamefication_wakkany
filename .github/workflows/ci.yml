name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate:
    name: Validate (lint → test → build → audit → semgrep)
    runs-on: ubuntu-24.04
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python (for semgrep)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test --silent

      - name: Build (preview production build)
        run: npm run build

      - name: Run secret scan
        run: npm run security:scan || true

      - name: Run npm audit
        run: npm run security:audit || true

      - name: Install Semgrep
        run: python -m pip install --upgrade pip && pip install semgrep

      - name: Run Semgrep
        run: semgrep --config .semgrep.yml --error --quiet . || true
